# Deploys the site to GitHub Pages on every push to main and stamps version.json
# with the exact commit and build time, which the landing page shows in its footer.
#
# One-time setup: in the repository's Settings → Pages, set "Build and deployment"
# to "GitHub Actions" (or run: gh api -X PUT repos/<owner>/<repo>/pages -f build_type=workflow).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stamp version.json
        run: node scripts/stamp.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
